<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Duper Achievement Icons</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;background:#101722;color:#eef3fa}
main{max-width:1100px;margin:auto;padding:28px}
h1{margin-bottom:6px}p{color:#b9c6d7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{border:1px solid #30445f;border-radius:12px;padding:12px;background:#1a2739;text-align:center}
.card img{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 8px}
.card a{color:#d7e8ff;text-decoration:none}
.card small{display:block;color:#9dafc4;margin-top:4px}
</style>
<main>
<h1>Super Duper Achievement Icons</h1>
<p>Versioned icon packs for iOS games. An icon does not imply that an achievement was unlocked.</p>
<div id="catalog">Loading catalog…</div>
</main>
<script>
(async()=>{
  const host=document.getElementById('catalog');
  try{
    const index=await (await fetch('index.json')).json();
    host.replaceChildren();
    for(const game of index.games){
      const section=document.createElement('section');
      const heading=document.createElement('h2');
      heading.textContent=`${game.bundleId} · ${game.bundleVersion}`;
      section.append(heading);
      const grid=document.createElement('div');grid.className='grid';
      const manifest=await (await fetch(game.manifest)).json();
      const base=game.manifest.slice(0,game.manifest.lastIndexOf('/')+1);
      for(const icon of manifest.icons){
        const card=document.createElement('div');card.className='card';
        const link=document.createElement('a');link.href=base+icon.path;
        const image=document.createElement('img');image.src=link.href;image.alt=icon.title;image.loading='lazy';
        const title=document.createElement('span');title.textContent=icon.title;
        const id=document.createElement('small');id.textContent=icon.gameCenterId.split('.').at(-1);
        link.append(image,title);card.append(link,id);grid.append(card);
      }
      section.append(grid);host.append(section);
    }
  }catch(error){host.textContent='Catalog unavailable: '+error.message;}
})();
</script>
</html>
